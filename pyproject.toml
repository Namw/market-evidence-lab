[project]
name = "market-evidence-lab"
version = "0.1.0"
description = "A minimal Django foundation for the Market Evidence Lab project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "httpx>=0.28,<1",
    "langchain>=1.0,<2",
    "langchain-deepseek>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "websockets>=15,<16",
]

[tool.uv]
package = false
