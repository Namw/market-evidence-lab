{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Market Evidence Lab{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}?v=8">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="主导航">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">ME</span>
                <div>
                    <strong>Market Evidence Lab</strong>
                    <span>市场证据实验室</span>
                </div>
            </div>

            <nav class="navigation">
                <a class="nav-item{% if request.resolver_match.namespace == 'core' %} is-active{% endif %}" href="{% url 'core:home' %}"{% if request.resolver_match.namespace == 'core' %} aria-current="page"{% endif %}>
                    <span>总览</span>
                </a>
                <span class="nav-item is-disabled" aria-disabled="true"><span>AI 报告</span><small>待建设</small></span>
                <a class="nav-item{% if request.resolver_match.namespace == 'research_cases' %} is-active{% endif %}" href="{% url 'research_cases:list' %}"{% if request.resolver_match.namespace == 'research_cases' %} aria-current="page"{% endif %}>
                    <span>研究案例</span><small>案例容器</small>
                </a>
                <span class="nav-item is-disabled" aria-disabled="true"><span>分析</span><small>待建设</small></span>
                <a class="nav-item{% if request.resolver_match.namespace == 'market_monitoring' %} is-active{% endif %}" href="{% url 'market_monitoring:index' %}"{% if request.resolver_match.namespace == 'market_monitoring' %} aria-current="page"{% endif %}>
                    <span>市场异常巡检</span><small>候选发现</small>
                </a>
                <a class="nav-item{% if request.resolver_match.namespace == 'inspection' %} is-active{% endif %}" href="{% url 'inspection:index' %}"{% if request.resolver_match.namespace == 'inspection' %} aria-current="page"{% endif %}>
                    <span>数据质量检查</span><small>已建设</small>
                </a>
                <details class="nav-group{% if request.resolver_match.namespace == 'collection' %} is-active{% endif %}"{% if request.resolver_match.namespace == 'collection' %} open{% endif %}>
                    <summary class="nav-item">
                        <span>采集</span><small>2 种方式</small>
                    </summary>
                    <div class="nav-submenu" aria-label="采集方式">
                        <a class="nav-subitem{% if request.resolver_match.namespace == 'collection' and request.resolver_match.url_name == 'index' %} is-active{% endif %}" href="{% url 'collection:index' %}"{% if request.resolver_match.namespace == 'collection' and request.resolver_match.url_name == 'index' %} aria-current="page"{% endif %}>
                            <span>K线采集</span><small>1d / 1h</small>
                        </a>
                        <a class="nav-subitem{% if request.resolver_match.namespace == 'collection' and request.resolver_match.url_name == 'derivatives' %} is-active{% endif %}" href="{% url 'collection:derivatives' %}"{% if request.resolver_match.namespace == 'collection' and request.resolver_match.url_name == 'derivatives' %} aria-current="page"{% endif %}>
                            <span>OI / Funding</span><small>衍生品</small>
                        </a>
                    </div>
                </details>
                <a class="nav-item{% if request.resolver_match.namespace == 'scheduling' %} is-active{% endif %}" href="{% url 'scheduling:index' %}"{% if request.resolver_match.namespace == 'scheduling' %} aria-current="page"{% endif %}>
                    <span>系统管理</span><small>自动调度</small>
                </a>
            </nav>

            <div class="sidebar-footer">阶段 8 · OI / Funding 证据 V1</div>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
