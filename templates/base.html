{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Market Evidence Lab{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}?v=20">
    <script>
        try {
            if (localStorage.getItem("market-evidence-sidebar-collapsed") === "true") {
                document.documentElement.classList.add("sidebar-collapsed");
            }
        } catch (error) {
            // Storage can be unavailable in hardened browser contexts.
        }
    </script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-shell">
        <aside class="sidebar" id="primary-sidebar" aria-label="主导航">
            <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-controls="primary-sidebar" aria-expanded="true" aria-label="收起侧边栏" title="收起侧边栏">
                <span aria-hidden="true"></span>
            </button>
            <div class="brand">
                {% include "core/_brand_symbol.html" %}
                <div class="brand-copy">
                    <strong>Market Evidence Lab</strong>
                    <span>市场证据实验室</span>
                </div>
            </div>

            <nav class="navigation">
                <a class="nav-item{% if request.resolver_match.namespace == 'core' %} is-active{% endif %}" href="{% url 'core:home' %}"{% if request.resolver_match.namespace == 'core' %} aria-current="page"{% endif %}>
                    <span>总览</span>
                </a>
                <details class="nav-group{% if request.resolver_match.namespace == 'market_monitoring' %} is-active{% endif %}" data-nav-group="market-monitoring"{% if request.resolver_match.namespace == 'market_monitoring' %} open{% endif %}>
                    <summary class="nav-item"><span>今日价值巡检</span><span class="nav-chevron" aria-hidden="true"></span></summary>
                    <div class="nav-submenu" aria-label="今日价值巡检">
                        <a class="nav-subitem{% if request.resolver_match.namespace == 'market_monitoring' %} is-active{% endif %}" href="{% url 'market_monitoring:index' %}"{% if request.resolver_match.namespace == 'market_monitoring' %} aria-current="page"{% endif %}>今日巡检结果</a>
                    </div>
                </details>
                <details class="nav-group{% if request.resolver_match.namespace == 'research_cases' %} is-active{% endif %}" data-nav-group="research-cases"{% if request.resolver_match.namespace == 'research_cases' %} open{% endif %}>
                    <summary class="nav-item"><span>研究案例</span><span class="nav-chevron" aria-hidden="true"></span></summary>
                    <div class="nav-submenu" aria-label="研究案例">
                        <a class="nav-subitem{% if request.resolver_match.namespace == 'research_cases' %} is-active{% endif %}" href="{% url 'research_cases:list' %}"{% if request.resolver_match.namespace == 'research_cases' %} aria-current="page"{% endif %}>案例列表</a>
                    </div>
                </details>
                <details class="nav-group{% if request.resolver_match.namespace == 'market_data' or request.resolver_match.namespace == 'inspection' or request.resolver_match.namespace == 'collection' %} is-active{% endif %}" data-nav-group="market-data"{% if request.resolver_match.namespace == 'market_data' or request.resolver_match.namespace == 'inspection' or request.resolver_match.namespace == 'collection' %} open{% endif %}>
                    <summary class="nav-item"><span>行情数据观察</span><span class="nav-chevron" aria-hidden="true"></span></summary>
                    <div class="nav-submenu" aria-label="行情数据观察">
                        <a class="nav-subitem{% if request.resolver_match.namespace == 'market_data' %} is-active{% endif %}" href="{% url 'market_data:index' %}"{% if request.resolver_match.namespace == 'market_data' %} aria-current="page"{% endif %}>数据查看</a>
                    </div>
                </details>
                <details class="nav-group{% if request.resolver_match.namespace == 'news_analysis' %} is-active{% endif %}" data-nav-group="news"{% if request.resolver_match.namespace == 'news_analysis' %} open{% endif %}>
                    <summary class="nav-item"><span>新闻观察</span><span class="nav-chevron" aria-hidden="true"></span></summary>
                    <div class="nav-submenu" aria-label="新闻观察">
                        <a class="nav-subitem{% if request.resolver_match.namespace == 'news_analysis' %} is-active{% endif %}" href="{% url 'news_analysis:index' %}"{% if request.resolver_match.namespace == 'news_analysis' %} aria-current="page"{% endif %}>数据分类结果</a>
                    </div>
                </details>
                <details class="nav-group{% if request.resolver_match.namespace == 'scheduling' %} is-active{% endif %}" data-nav-group="system"{% if request.resolver_match.namespace == 'scheduling' %} open{% endif %}>
                    <summary class="nav-item"><span>系统管理</span><span class="nav-chevron" aria-hidden="true"></span></summary>
                    <div class="nav-submenu" aria-label="系统管理">
                        <a class="nav-subitem{% if request.resolver_match.namespace == 'scheduling' and request.resolver_match.url_name == 'index' %} is-active{% endif %}" href="{% url 'scheduling:index' %}"{% if request.resolver_match.namespace == 'scheduling' and request.resolver_match.url_name == 'index' %} aria-current="page"{% endif %}>自动调度</a>
                        <a class="nav-subitem{% if request.resolver_match.namespace == 'scheduling' and request.resolver_match.url_name == 'runs' or request.resolver_match.namespace == 'scheduling' and request.resolver_match.url_name == 'run_detail' %} is-active{% endif %}" href="{% url 'scheduling:runs' %}"{% if request.resolver_match.namespace == 'scheduling' and request.resolver_match.url_name == 'runs' or request.resolver_match.namespace == 'scheduling' and request.resolver_match.url_name == 'run_detail' %} aria-current="page"{% endif %}>调度情况</a>
                    </div>
                </details>
            </nav>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{% static 'core/js/navigation.js' %}?v=2" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
